<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600,height=600,initial-scale=1">
<meta name="mrbd-web-app-capable" content="yes">
<title>Quran — Text entry test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:600px;height:600px;overflow:hidden;background:#000;color:#fff;font:22px Arial,sans-serif}main{padding:24px}h1{font-size:28px;margin:0 0 12px}p{margin:12px 0;line-height:1.4}label{display:block;margin-top:18px}input,textarea,a{display:block;width:100%;min-height:88px;margin-top:8px;padding:16px;font:24px Arial,sans-serif;background:#1c1e21;color:white;border:2px solid #888;border-radius:8px}textarea{height:88px;resize:none}a{min-height:60px;text-align:center}input:focus,textarea:focus,a:focus{outline:4px solid #4ce0ff;outline-offset:2px}
</style>
</head>
<body><main>
<h1>Text entry test</h1>
<p>Highlight a box, then pinch to write or dictate.</p>
<label for="plainText">1. Text field</label>
<input id="plainText" class="focusable" type="text" placeholder="Select to write or dictate" aria-label="Test text field">
<label for="plainNote">2. Writing box</label>
<textarea id="plainNote" class="focusable" placeholder="Select to write or dictate" aria-label="Test writing box"></textarea>
<a href="./" class="focusable">Return to Quran</a>
</main></body></html>
