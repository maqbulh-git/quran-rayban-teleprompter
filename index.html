<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=600,height=600,initial-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000">
  <title>Quran Teleprompter</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <header id="topbar">
    <span id="title">القرآن الكريم</span>
    <span id="counter">—</span>
  </header>

  <section id="setup">
    <div class="setupTitle">اختيار الآيات <span id="stepCount">١/٣</span></div>
    <label id="fieldLabel" for="numberInput">السورة</label>
    <input id="numberInput" inputmode="numeric" value="17" aria-label="Surah number">
    <button id="backBtn" type="button" hidden>السابق</button>
    <button id="nextBtn" type="button">التالي</button>
    <div id="rangeSummary">السورة 17 · من 1 · إلى 40</div>
    <div id="message">اكتب الرقم ثم اختر التالي</div>
  </section>

  <section id="reader" tabindex="0">
    <div id="verses"></div>
  </section>

  <footer id="controls">
    <span id="status">▶</span>
    <span id="speed">سرعة ٢٥</span>
    <span>↑↓ السرعة</span>
    <span>Enter تشغيل/إيقاف</span>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
