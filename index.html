<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=600,height=600,initial-scale=1,user-scalable=no">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="theme-color" content="#000">
  <title>Quran Teleprompter</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <header id="topbar">
    <span id="title">القرآن الكريم</span>
    <span id="counter">—</span>
  </header>

  <section id="setup">
    <div class="setupTitle">اختيار السورة والآيات</div>
    <div class="fieldRow">
      <label for="surahInput">السورة</label>
      <input id="surahInput" inputmode="numeric" value="17" aria-label="Surah number">
      <button id="surahMinus" type="button" aria-label="Decrease Surah number">−</button>
      <button id="surahPlus" type="button" aria-label="Increase Surah number">+</button>
    </div>
    <div class="fieldRow">
      <label for="startInput">من الآية</label>
      <input id="startInput" inputmode="numeric" value="1" aria-label="Start verse">
      <button id="startMinus" type="button" aria-label="Decrease Start verse">−</button>
      <button id="startPlus" type="button" aria-label="Increase Start verse">+</button>
    </div>
    <div class="fieldRow">
      <label for="endInput">إلى الآية</label>
      <input id="endInput" inputmode="numeric" value="111" aria-label="End verse">
      <button id="endMinus" type="button" aria-label="Decrease End verse">−</button>
      <button id="endPlus" type="button" aria-label="Increase End verse">+</button>
    </div>
    <button id="loadBtn" type="button">تحميل</button>
    <div id="rangeSummary"></div>
    <div id="message">اختر الحقل للكتابة أو استخدم − / + ثم تحميل</div>
  </section>

  <section id="reader" tabindex="0">
    <div id="verses"></div>
  </section>

  <footer id="controls">
    <span id="status">▶</span>
    <span id="speed">سرعة ٢٥</span>
    <span>↑↓ تمرير</span>
    <span>←→ السرعة</span>
    <span>Enter تشغيل/إيقاف</span>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
